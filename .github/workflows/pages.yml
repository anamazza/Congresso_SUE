# Publica a pasta site/ no GitHub Pages a cada envio para a branch principal.
# No repositório: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publicar site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Configurar o Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Empacotar a pasta site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
