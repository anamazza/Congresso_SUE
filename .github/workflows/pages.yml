# Publica a pasta site/ no GitHub Pages a cada envio para a branch principal.
# Como funciona: copia o conteúdo de site/ para a branch gh-pages, que o
# GitHub Pages usa como fonte (Settings > Pages > Branch: gh-pages, pasta /).
name: Publicar site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Enviar a pasta site/ para a branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publicar site"
